name: Update Playlist JSON Every 3 Hours

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and parse playlist
        id: parse
        run: |
          for i in 1 2 3; do
            if python zee5.py; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Commit and push if zee5.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          if git diff --staged --quiet; then
            echo "No changes to zee5.json"
          else
            git commit -m "chore: update zee5.json [skip ci]"
            git push
          fi
